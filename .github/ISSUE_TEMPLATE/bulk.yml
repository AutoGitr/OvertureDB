name: Bulk contribution
description: Submit bulk exported artwork and theme selections from Overture.
title: "[Bulk]: Contribution from Overture"
labels: ["contribution", "bulk"]

body:
  - type: markdown
    attributes:
      value: |
        Export saved library selections from Overture (**OvertureDB -> Export selections**).
        Attach the downloaded `overturedb-selections.zip` to this issue.

        Before submitting, please review the [Selection Guidelines](https://github.com/AutoGitr/OvertureDB/blob/main/docs/selection-guidelines.md). All contributions must follow these guidelines.

        **How Bulk Contributions Work**:
        - Only missing items and values are added.
        - Existing items and values are not modified, to do that, create a separate issue for the item you want to update.

  - type: textarea
    id: archive
    attributes:
      label: OvertureDB Selections Archive
      placeholder: Attach or drag and drop overturedb-selections.zip here...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
    validations:
      required: false
