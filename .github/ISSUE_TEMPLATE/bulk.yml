name: Bulk contribution
description: Submit bulk exported artwork and theme selections from Overture.
title: "[Bulk]: Contribution from Overture"
labels: ["contribution", "bulk"]

body:
  - type: markdown
    attributes:
      value: |
        Export saved library selections from Overture (**OvertureDB -> Export selections**).
        Attach the downloaded `overturedb-selections.zip` to this issue.

        **How a Bulk Contributions Works**:
        - Only missing items and values are added.
        - No existing items or values are modified or deleted. To modify selections, please submit a separate issue with the specific changes.

  - type: textarea
    id: archive
    attributes:
      label: OvertureDB Selections Archive
      placeholder: Attach or drag and drop overturedb-selections.zip here...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
    validations:
      required: false

  - type: checkboxes
    id: assert
    attributes:
      label: Contribution Guidelines
      options:
        - label: I have read and followed the [Contribution Guidelines](https://github.com/OvertureDB/OvertureDB/blob/main/CONTRIBUTING.md).
          required: true
