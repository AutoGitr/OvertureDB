name: Contribute show metadata
description: Submit public art and theme links for a show.
title: "[Show]: Title (Year)"
labels: ["contribution", "show"]

body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please review the [Contribution Guidelines and Selection Criteria](https://github.com/OvertureDB/OvertureDB/blob/main/CONTRIBUTING.md#selection-criteria).

  - type: input
    id: item_title
    attributes:
      label: Title
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: Year
      description: Four-digit first-air year.
      placeholder: "2001"

  - type: input
    id: tmdb_id
    attributes:
      label: TMDB ID
      description: Required if available on TMDB.
      placeholder: "4613"

  - type: input
    id: tvdb_id
    attributes:
      label: TVDB ID
      description: Required if available on TVDB.
      placeholder: "74205"

  - type: input
    id: imdb_id
    attributes:
      label: IMDb ID
      description: Required if available on IMDb.
      placeholder: "tt0185906"

  - type: input
    id: poster_url
    attributes:
      label: Poster URL
      description: HTTPS JPG/JPEG/PNG image URL from image.tmdb.org, assets.fanart.tv, theposterdb.com/api/assets/, artworks.thetvdb.com or metadata-static.plex.tv.

  - type: input
    id: background_url
    attributes:
      label: Background URL
      description: HTTPS JPG/JPEG/PNG image URL from image.tmdb.org, assets.fanart.tv, theposterdb.com/api/assets/, artworks.thetvdb.com or metadata-static.plex.tv.

  - type: input
    id: youtube_id
    attributes:
      label: YouTube theme video ID
      description: Use only the 11-character video ID, not the full URL.
      placeholder: AB96CvvLZKc

  - type: textarea
    id: season_posters
    attributes:
      label: Season posters
      description: One HTTPS JPG/JPEG/PNG image URL per line, format season_num=url. Use theposterdb.com/api/assets/ for ThePosterDB links.
      placeholder: 1=https://image.tmdb.org/t/p/original/example.jpg

  - type: textarea
    id: modification_reason
    attributes:
      label: Reason for modification (if replacing existing artwork or theme)
      value: "If this modifies an existing entry, replace this text with a reason for the change (e.g. higher resolution, textless, dead link, corrected ID)."
    validations:
      required: true

  - type: checkboxes
    id: assert
    attributes:
      label: Contribution Guidelines
      options:
        - label: I have read and followed the [Contribution Guidelines](https://github.com/OvertureDB/OvertureDB/blob/main/CONTRIBUTING.md).
          required: true
