name: Contribute show metadata
description: Submit public art and theme links for a show.
title: "[Show]: Title (Year)"
labels: ["contribution", "show"]

body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please review the [Selection Guidelines](https://github.com/AutoGitr/OvertureDB/blob/main/docs/selection-guidelines.md). All contributions must follow these guidelines.

  - type: input
    id: item_title
    attributes:
      label: Title
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: Year
      description: Four-digit first-air year.
      placeholder: "2001"

  - type: input
    id: tmdb_id
    attributes:
      label: TMDB ID
      description: TMDB ID or title URL. Provide at least one of the three identifiers.
      placeholder: "4613"

  - type: input
    id: tvdb_id
    attributes:
      label: TVDB ID
      description: TVDB ID or title URL. Provide at least one of the three identifiers.
      placeholder: "74205"

  - type: input
    id: imdb_id
    attributes:
      label: IMDb ID
      description: IMDb ID or title URL. Provide at least one of the three identifiers.
      placeholder: "tt0185906"

  - type: input
    id: poster_url
    attributes:
      label: Poster URL
      description: HTTPS JPG/JPEG/PNG image URL from image.tmdb.org, assets.fanart.tv, theposterdb.com/api/assets/, artworks.thetvdb.com or metadata-static.plex.tv.

  - type: input
    id: background_url
    attributes:
      label: Background URL
      description: HTTPS JPG/JPEG/PNG image URL from image.tmdb.org, assets.fanart.tv, theposterdb.com/api/assets/, artworks.thetvdb.com or metadata-static.plex.tv.

  - type: input
    id: youtube_id
    attributes:
      label: YouTube theme video ID
      description: YouTube URL or 11-character video ID.
      placeholder: AB96CvvLZKc

  - type: textarea
    id: season_posters
    attributes:
      label: Season posters
      description: One HTTPS JPG/JPEG/PNG image URL per line, format season_num=url. Use theposterdb.com/api/assets/ for ThePosterDB links.
      placeholder: 1=https://image.tmdb.org/t/p/original/example.jpg

  - type: textarea
    id: modification_reason
    attributes:
      label: Reason for modification (if replacing existing artwork or theme)
      description: Required only when replacing existing artwork or a theme.
      placeholder: "For example: higher resolution, textless artwork, or a corrected link."
