name: Publish Catalog

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'schema/**'
      - 'licenses/**'
      - '.github/scripts/**'
      - '.github/workflows/publish-catalog.yml'
      - 'scripts/pre-commit-check.sh'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    - cron: "15 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout catalog source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version-file: .python-version

      - name: Test and validate the complete dataset
        run: bash scripts/pre-commit-check.sh

      - name: Build reproducible catalog
        run: uv run --locked python .github/scripts/catalog.py build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated catalog
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
