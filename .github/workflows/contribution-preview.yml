name: Contribution Preview
run-name: 'Contribution #${{ github.event.issue.number }} preview'

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: contribution-preview-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'contribution') &&
      !contains(github.event.issue.labels.*.name, 'rejected') &&
      (github.event.action != 'labeled' ||
       contains(fromJSON('["contribution", "movie", "show", "bulk"]'), github.event.label.name))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
          python-version-file: .python-version
      - name: Validate and update preview
        run: uv run --locked python .github/scripts/automation.py preview
        env:
          GH_TOKEN: ${{ github.token }}
