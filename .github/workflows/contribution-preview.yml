name: Contribution Preview
run-name: 'Contribution #${{ github.event.issue.number }} preview'

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: contribution-preview-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'contribution') &&
      !contains(github.event.issue.labels.*.name, 'rejected') &&
      (github.event.action != 'labeled' ||
       contains(fromJSON('["contribution", "movie", "show", "bulk"]'), github.event.label.name))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
      - name: Validate and update preview
        run: uv run --locked python scripts/automation.py preview
        env:
          GH_TOKEN: ${{ github.token }}
