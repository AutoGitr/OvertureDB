name: Contribution to Pull Request
run-name: 'Contribution #${{ github.event.issue.number }} processed by @${{ github.actor }}'

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: contribution-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  contribute:
    if: >-
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'contribution') &&
      startsWith(github.event.comment.body, '@OvertureDB-bot ')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
      - name: Authorize command against current issue
        id: gate
        run: uv run --locked python scripts/automation.py gate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare approved changes
        if: steps.gate.outputs.approved == 'true'
        run: |
          uv run --locked python scripts/automation.py prepare --output "$RUNNER_TEMP/contribution.json"
          uv run --locked python scripts/catalog.py validate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate bot token
        if: steps.gate.outputs.approved == 'true'
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OVERTUREDB_CLIENT_ID }}
          private-key: ${{ secrets.OVERTUREDB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Create contribution pull request
        if: steps.gate.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: uv run --locked python scripts/automation.py publish --input "$RUNNER_TEMP/contribution.json"
