name: Contribution to Pull Request
run-name: 'Contribution #${{ github.event.issue.number }} processed by @${{ github.actor }}'

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: contribution-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  contribute:
    if: >-
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'contribution') &&
      startsWith(github.event.comment.body, '@OvertureDB-bot ')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
          python-version-file: .python-version
      - name: Authorize command against current issue
        id: gate
        run: uv run --locked python .github/scripts/automation.py gate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare approved changes
        if: steps.gate.outputs.approved == 'true'
        run: |
          uv run --locked python .github/scripts/automation.py prepare --output "$RUNNER_TEMP/contribution.json"
          uv run --locked python .github/scripts/catalog.py validate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate bot token
        if: steps.gate.outputs.approved == 'true'
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OVERTUREDB_CLIENT_ID }}
          private-key: ${{ secrets.OVERTUREDB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Create contribution pull request
        if: steps.gate.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/contribution.json"
          branch="$(jq -r .branch "$result")"
          title="$(jq -r .title "$result")"
          jq -r .body "$result" > "$RUNNER_TEMP/pr-body.md"
          mapfile -t files < <(jq -r '.files[]' "$result")
          mapfile -t labels < <(jq -r '.labels[]' "$result")
          label_args=()
          for label in "${labels[@]}"; do label_args+=(--label "$label"); done
          gh auth setup-git
          existing="$(gh pr list --repo "$REPO" --head "$branch" --state all --json url --jq '.[0].url // ""')"
          if [ -n "$existing" ]; then
            echo "Contribution already has a pull request: $existing"
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'overturedb[bot]'
          git config user.email 'overturedb[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo 'No dataset changes.'
            exit 0
          fi
          git commit -m "$title"
          git push origin "$branch"
          pr_url="$(gh pr create --repo "$REPO" --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md" "${label_args[@]}")"
          if ! jq -e '.labels | index("bulk")' "$result" >/dev/null; then
            uv run --locked python .github/scripts/automation.py auto-merge --pr "$pr_url"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Contribution pull request: $pr_url"
