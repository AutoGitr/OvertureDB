name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  languages:
    name: Detect changed languages
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Each language is analysed only when its code changes, so dataset
      # contributions start no analysis; the weekly run and a manual run
      # analyse both.
      - name: Select the languages to analyse
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          all='["python","actions"]'
          if [ "$EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          elif [ "$EVENT_NAME" = push ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE_SHA" HEAD)
          else
            echo "languages=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^\.github/workflows/codeql\.yml$' <<< "$changed"; then
            echo "languages=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          languages=()
          if grep -Eq '^(scripts|schema)/.+\.py$' <<< "$changed"; then
            languages+=('"python"')
          fi
          if grep -Eq '^\.github/workflows/' <<< "$changed"; then
            languages+=('"actions"')
          fi
          echo "languages=[$(IFS=,; echo "${languages[*]}")]" >> "$GITHUB_OUTPUT"

  codeql:
    name: codeql (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.languages != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Tests are not shipped, so they are left out of the analysis.
          config: |
            paths-ignore:
              - tests/**

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
