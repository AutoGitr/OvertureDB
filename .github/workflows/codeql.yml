name: CodeQL

# A pull request or push runs it only when analysed code changes, so catalog
# contributions start no analysis; a run analyses every language, so its
# results always compare with main's. The weekly run catches newly disclosed
# vulnerable patterns in unchanged code.
on:
  push:
    branches: [main]
    paths:
      - scripts/**/*.py
      - schema/**/*.py
      - .github/workflows/**
  pull_request:
    branches: [main]
    paths:
      - scripts/**/*.py
      - schema/**/*.py
      - .github/workflows/**
  workflow_dispatch:
  schedule:
    - cron: '7 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: Analyze
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Tests are not shipped, so they are left out of the analysis.
          config: |
            paths-ignore:
              - tests/**

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
