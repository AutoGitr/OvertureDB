name: CodeQL

# A pull request or push runs it only when analysed code changes, so catalog
# contributions start no analysis; a run analyses every language, so its
# results always compare with main's. The weekly run catches newly disclosed
# vulnerable patterns in unchanged code.
on:
  push:
    branches: [main]
    paths:
      - scripts/**/*.py
      - schema/**/*.py
      - .github/workflows/**
      - .github/codeql/**
  pull_request:
    branches: [main]
    paths:
      - scripts/**/*.py
      - schema/**/*.py
      - .github/workflows/**
      - .github/codeql/**
  workflow_dispatch:
  schedule:
    - cron: '7 4 * * 1'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: Analyze
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
