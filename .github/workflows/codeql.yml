name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql-gate:
    name: codeql-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_codeql=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet --no-renames "$BASE_SHA...$HEAD_SHA" -- . ':!data/**'; then
            echo "run_codeql=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "Could not determine changed paths."
              exit "$status"
            fi
            echo "run_codeql=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: steps.filter.outputs.run_codeql == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python, actions
          build-mode: none

      - name: Perform CodeQL Analysis
        if: steps.filter.outputs.run_codeql == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
