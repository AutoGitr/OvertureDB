name: Bulk Contribution to Pull Request
run-name: "Bulk Contribution #${{ github.event.issue.number }} approved by @${{ github.actor }}"

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: bulk-contribution-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve-gate:
    if: |
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'contribution') &&
      contains(github.event.issue.labels.*.name, 'bulk')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      approved: ${{ steps.gate.outputs.approved }}

    steps:
      - name: Check approval command and permission
        id: gate
        env:
          ACTOR: ${{ github.actor }}
          COMMAND_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          command_body="$(
            printf '%s' "$COMMAND_BODY" \
              | tr -d '\r' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
          )"

          if [ "$command_body" != "@OvertureDB-bot approve" ]; then
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          actor_permission="$(
            gh api "repos/${REPO}/collaborators/${ACTOR}/permission" \
              --jq '.permission' 2>/dev/null || true
          )"

          case "$actor_permission" in
            admin|maintain|write)
              echo "approved=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "approved=false" >> "$GITHUB_OUTPUT"
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
                --body "Ignoring approval command from @${ACTOR}: owner or maintainer access is required to approve bulk contributions."
              ;;
          esac

  create-bulk-pr:
    needs: approve-gate
    if: needs.approve-gate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.OVERTUREDB_CLIENT_ID }}
          private-key: ${{ secrets.OVERTUREDB_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          token: ${{ steps.bot-token.outputs.token }}
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14.7

      - name: Create bulk contribution PR from issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            message="$1"
            echo "$message" >&2
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Could not create bulk contribution pull request: ${message}"
            exit 1
          }

          zip_url="$(printf '%s' "$ISSUE_BODY" | grep -Eo 'https://github\.com/(user-attachments/(assets/[a-zA-Z0-9_.~-]+|files/[0-9]+/[a-zA-Z0-9_.~-]+)|[^/ ]+/[^/ ]+/files/[0-9]+/[a-zA-Z0-9_.~-]+)' | head -n1 || true)"
          [ -n "$zip_url" ] || fail "No valid GitHub-attached \`.zip\` archive found in the issue description."

          archive_file="$(mktemp --suffix=.zip)"
          curl -fSL --max-filesize 10485760 "$zip_url" -o "$archive_file" 2>/dev/null || fail "Could not download attached archive from ${zip_url} (file may exceed 10 MB limit or be inaccessible)."

          if ! import_output="$(uv run python .github/scripts/import_bulk_export.py --archive "$archive_file" 2>&1)"; then
            fail "$import_output"
          fi

          if ! validation_output="$(uv run python .github/scripts/catalog.py validate 2>&1)"; then
            fail "$validation_output"
          fi

          branch="contribution/bulk-issue-${ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            fail "Contribution branch already exists: \`${branch}\`. Please review the existing branch or pull request."
          fi

          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data

          if git diff --cached --quiet; then
            fail "No new dataset changes were produced (all records were already populated or unchanged)."
          fi

          git commit -m "Bulk dataset contribution from issue #${ISSUE_NUMBER}"
          git push origin "$branch"

          pr_title="Bulk contribution from #${ISSUE_NUMBER}"
          pr_body="$(
            printf '%s\n\n' "Closes #${ISSUE_NUMBER}"
            echo '### Summary of Import'
            echo '```text'
            printf '%s\n' "$import_output"
            echo '```'
          )"

          pr_url="$(
            gh pr create \
              --repo "$REPO" \
              --base main \
              --head "$branch" \
              --title "$pr_title" \
              --body "$pr_body"
          )"

          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "Created pull request for this bulk contribution: ${pr_url}"
