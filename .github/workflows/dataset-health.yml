name: Dataset Health

# Daily, right after the import, so newly imported entries are checked the
# same day.
on:
  workflow_run:
    workflows: [Import ThemerrDB]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print the report; update nothing)"
        type: boolean
        default: false
      limit:
        description: "Rotating entries to check, in addition to changed problem entries (optional)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dataset-health
  cancel-in-progress: false

jobs:
  health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout OvertureDB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Generate bot token
        if: inputs.dry_run != true
        id: bot-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.OVERTUREDB_CLIENT_ID }}
          private-key: ${{ secrets.OVERTUREDB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write

      - name: Check dataset health
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          uv run --locked python -m scripts.dataset_health "${ARGS[@]}"
