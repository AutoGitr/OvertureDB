name: Import ThemerrDB

on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not commit changes)"
        type: boolean
        default: false
      limit:
        description: "Maximum items to process (optional)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: themerrdb-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v1.11.1
        with:
          client-id: ${{ secrets.OVERTUREDB_CLIENT_ID }}
          private-key: ${{ secrets.OVERTUREDB_APP_PRIVATE_KEY }}

      - name: Checkout OvertureDB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.bot-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Checkout ThemerrDB database branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LizardByte/ThemerrDB
          ref: database
          path: themerrdb
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            movies/themoviedb
            tv_shows/themoviedb

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Install dependencies
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Run ThemerrDB import
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=(--themerr-dir themerrdb --overture-dir .)
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          python .github/scripts/import_themerrdb.py "${ARGS[@]}"

      - name: Run test suite
        run: |
          ruff check .github/scripts
          ruff format --check .github/scripts
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          python .github/scripts/catalog.py validate

      - name: Create pull request for imported changes
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changes to commit."
            exit 0
          fi

          date_stamp="$(date -u +'%Y-%m-%d')"
          branch="automation/themerrdb-${date_stamp}"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch="automation/themerrdb-${date_stamp}-${{ github.run_id }}"
          fi

          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: daily import from themerrdb ${date_stamp}"
          git push origin "$branch"

          pr_title="chore: daily import from themerrdb ${date_stamp}"
          pr_body="Automated daily import from ThemerrDB for ${date_stamp}."

          pr_url="$(
            gh pr create \
              --repo "$REPO" \
              --base main \
              --head "$branch" \
              --title "$pr_title" \
              --body "$pr_body"
          )"

          echo "Created pull request: $pr_url"

          if ! gh pr merge "$pr_url" --repo "$REPO" --auto --squash --delete-branch; then
            echo "Auto-merge could not be enabled for $pr_url" >&2
            exit 1
          fi
