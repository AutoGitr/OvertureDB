name: Import ThemerrDB

on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not commit changes)"
        type: boolean
        default: false
      limit:
        description: "Maximum items to process (optional)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: themerrdb-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout OvertureDB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Checkout ThemerrDB database branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LizardByte/ThemerrDB
          ref: database
          path: themerrdb
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            movies/themoviedb
            tv_shows/themoviedb

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"

      - name: Run ThemerrDB import
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=(--themerr-dir themerrdb --output "$RUNNER_TEMP/import.json")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          uv run --locked python scripts/import_themerrdb.py "${ARGS[@]}"

      - name: Run test suite
        run: bash scripts/pre-commit-check.sh

      - name: Generate bot token
        if: inputs.dry_run != true
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OVERTUREDB_CLIENT_ID }}
          private-key: ${{ secrets.OVERTUREDB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request for imported changes
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: uv run --locked python scripts/automation.py import-pr --input "$RUNNER_TEMP/import.json"
