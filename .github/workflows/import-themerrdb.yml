name: Import ThemerrDB

on:
  schedule:
    # Starts the daily pipeline: it calls Catalog Health and Publish Catalog.
    # Off the top of the hour, when GitHub delays scheduled runs the most.
    - cron: "23 14 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum items to process (optional)"
        type: string
        default: ""

concurrency:
  group: catalog-write
  cancel-in-progress: false
  queue: max

jobs:
  import:
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout OvertureDB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Checkout ThemerrDB database branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LizardByte/ThemerrDB
          ref: database
          path: themerrdb
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            movies/themoviedb
            tv_shows/themoviedb
            movie_collections/themoviedb

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install secret scanner for candidate validation
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.OVERTUREDB_CLIENT_ID }}
          private-key: ${{ secrets.OVERTUREDB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Run ThemerrDB import
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=(--themerr-dir themerrdb --output "$RUNNER_TEMP/import.json")
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          uv run --locked python -m scripts.import_themerrdb "${ARGS[@]}"

  # The rest of the daily pipeline runs whatever the import did: the day's
  # approved contributions are checked and published either way.
  health:
    needs: import
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/catalog-health.yml
    secrets:
      OVERTUREDB_CLIENT_ID: ${{ secrets.OVERTUREDB_CLIENT_ID }}
      OVERTUREDB_APP_PRIVATE_KEY: ${{ secrets.OVERTUREDB_APP_PRIVATE_KEY }}

  publish:
    needs: [import, health]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/publish-catalog.yml
