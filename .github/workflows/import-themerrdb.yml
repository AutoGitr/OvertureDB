name: Import ThemerrDB

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum items to process (optional)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: themerrdb-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout OvertureDB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Checkout ThemerrDB database branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LizardByte/ThemerrDB
          ref: database
          path: themerrdb
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            movies/themoviedb
            tv_shows/themoviedb

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Run ThemerrDB import
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=(--themerr-dir themerrdb --output "$RUNNER_TEMP/import.json")
          ARGS+=(--dry-run)
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          uv run --locked python -m scripts.import_themerrdb "${ARGS[@]}"

      - name: Run test suite
        run: bash scripts/pre-commit-check.sh

