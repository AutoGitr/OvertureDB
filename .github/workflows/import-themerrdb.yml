name: Import ThemerrDB

on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not commit changes)"
        type: boolean
        default: false
      limit:
        description: "Maximum items to process (optional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: themerrdb-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OvertureDB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout ThemerrDB database branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LizardByte/ThemerrDB
          ref: database
          path: themerrdb
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            movies/themoviedb
            tv_shows/themoviedb

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Install dependencies
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Run ThemerrDB import
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=(--themerr-dir themerrdb --overture-dir .)
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          python .github/scripts/import_themerrdb.py "${ARGS[@]}"

      - name: Run test suite
        run: |
          ruff check .github/scripts
          ruff format --check .github/scripts
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          python .github/scripts/catalog.py validate

      - name: Commit and push changes
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore: daily import from themerrdb $(date -u +'%Y-%m-%d')"
            git push origin main
          else
            echo "No data changes to commit."
          fi
