name: Import ThemerrDB

on:
  schedule:
    # Starts the daily pipeline: Dataset Health and Publish Catalog follow it.
    # Off the top of the hour, when GitHub delays scheduled runs the most.
    - cron: "23 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate and count without committing)"
        type: boolean
        default: false
      limit:
        description: "Maximum items to process (optional)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dataset-write
  cancel-in-progress: false
  queue: max

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout OvertureDB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Checkout ThemerrDB database branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LizardByte/ThemerrDB
          ref: database
          path: themerrdb
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            movies/themoviedb
            tv_shows/themoviedb
            movie_collections/themoviedb

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install secret scanner for candidate validation
        if: inputs.dry_run != true
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1

      - name: Generate bot token
        if: inputs.dry_run != true
        id: bot-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.OVERTUREDB_CLIENT_ID }}
          private-key: ${{ secrets.OVERTUREDB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Run ThemerrDB import
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=(--themerr-dir themerrdb --output "$RUNNER_TEMP/import.json")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--commit)
          fi
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          uv run --locked python -m scripts.import_themerrdb "${ARGS[@]}"
