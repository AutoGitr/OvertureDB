name: Bulk Contribution Preview
run-name: "Bulk Contribution #${{ github.event.issue.number }} preview"

on:
  issues:
    types: [opened, edited, labeled]

permissions: {}

concurrency:
  group: bulk-contribution-preview-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: |
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'contribution') &&
      contains(github.event.issue.labels.*.name, 'bulk')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14.7

      - name: Build and comment preview
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          marker="<!-- overturedb-bulk-contribution-preview -->"
          comment_file="$(mktemp)"
          payload_file="$(mktemp)"

          zip_url="$(printf '%s' "$ISSUE_BODY" | grep -Eo 'https://github\.com/(user-attachments/(assets/[a-zA-Z0-9_.~-]+|files/[0-9]+/[a-zA-Z0-9_.~-]+)|[^/ ]+/[^/ ]+/files/[0-9]+/[a-zA-Z0-9_.~-]+)' | head -n1 || true)"

          {
            echo "$marker"
            echo "### OvertureDB Bulk Contribution Preview"
            echo

            if [ -z "$zip_url" ]; then
              echo "⚠️ No valid GitHub-attached \`.zip\` archive found in the issue description."
              echo "Please attach your \`overturedb-selections.zip\` by editing the issue and dragging the file into the description area."
            else
              echo "Archive: \`$zip_url\`"
              echo
              archive_file="$(mktemp --suffix=.zip)"
              if curl -fSL --max-filesize 10485760 "$zip_url" -o "$archive_file" 2>/dev/null; then
                report="$(uv run python .github/scripts/import_bulk_export.py --archive "$archive_file" --dry-run 2>&1 || true)"
                echo '```text'
                printf '%s\n' "$report"
                echo '```'
              else
                echo "⚠️ Could not download attached archive file (must be a valid GitHub attachment under 10 MB)."
              fi
            fi

            echo
            cat bot_commands.md
          } > "$comment_file"

          jq -n --rawfile body "$comment_file" '{body: $body}' > "$payload_file"

          comment_id="$(
            gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --paginate \
              --jq '.[] | select(.body | contains("<!-- overturedb-bulk-contribution-preview -->")) | .id' \
              | tail -n1
          )"

          if [ -n "$comment_id" ]; then
            gh api "repos/${REPO}/issues/comments/${comment_id}" \
              --method PATCH \
              --input "$payload_file" >/dev/null
          else
            gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
              --method POST \
              --input "$payload_file" >/dev/null
          fi
