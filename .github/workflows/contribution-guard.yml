name: Contribution Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

concurrency:
  group: contribution-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contribution-guard:
    permissions:
      contents: read
    name: contribution-guard
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install secret scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.76.2
      - name: Check code, contracts, complete catalog, dependencies and secrets
        run: bash scripts/contribution-check.sh
      - name: Validate pull request catalog provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python -m scripts.guard
      # Overture's models define presets; a preset or contract change must be
      # one the released Overture code reads.
      - name: Checkout Overture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AutoGitr/Overture
          path: overture-checkout
          persist-credentials: false
      - name: Set up uv for Overture
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: overture-checkout
      - name: Check presets and the contract against Overture
        env:
          OVERTUREDB_DIR: ${{ github.workspace }}
          OVERTURE_REQUIRE_SIBLING: "1"
        run: |
          uv run --locked --directory overture-checkout python -m scripts.preset_contract "$GITHUB_WORKSPACE" --check
          uv run --locked --directory overture-checkout python -m scripts.catalog_contract "$GITHUB_WORKSPACE" --check
          uv run --locked --directory overture-checkout python -m pytest tests/test_release/test_shared_files.py -p no:cacheprovider --no-cov
