name: Contribution Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contribution-guard:
    name: contribution-guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.7"

      - name: Install validator
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Test and validate the complete dataset
        run: |
          ruff check .github/scripts
          ruff format --check .github/scripts
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          python .github/scripts/catalog.py validate

      - name: Validate contribution changes
        shell: bash
        env:
          BOT_LOGIN: overturedb[bot]
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
            deleted_dataset_files="$(git diff --name-only --diff-filter=D "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'data/**/*.json' || true)"
          else
            if [ -d data ]; then
              changed_files="$(find data -name '*.json' | sort)"
            else
              changed_files=""
            fi
            deleted_dataset_files=""
          fi

          if [ -n "$deleted_dataset_files" ]; then
            echo "Dataset entries may not be deleted in pull requests:"
            echo "$deleted_dataset_files"
            exit 1
          fi

          dataset_files="$(printf '%s\n' "$changed_files" | grep -E '^data/.+\.json$' | sort || true)"

          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$dataset_files" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "Dataset changes must come from an internal OvertureDB bot branch."
              exit 1
            fi

            if [[ "$HEAD_REF" != contribution/issue-* ]]; then
              echo "Dataset changes must come from a contribution/issue-* branch."
              exit 1
            fi

            if [ "${{ github.event.pull_request.user.login }}" != "$BOT_LOGIN" ]; then
              echo "Dataset changes must be opened by ${BOT_LOGIN}."
              echo "Actual PR author: ${{ github.event.pull_request.user.login }}"
              exit 1
            fi

            non_dataset_files="$(printf '%s\n' "$changed_files" | grep -Ev '^data/.+\.json$' || true)"
            if [ -n "$non_dataset_files" ]; then
              echo "Bot contribution pull requests may only change dataset JSON files:"
              echo "$non_dataset_files"
              exit 1
            fi
          fi

          if [ -z "$dataset_files" ]; then
            echo "No dataset files changed"
          else
            echo "Dataset files changed:"
            echo "$dataset_files"

            while IFS= read -r file; do
              [ -n "$file" ] || continue
              python .github/scripts/catalog.py validate --check-urls --entry "$file"
            done <<< "$dataset_files"
          fi
