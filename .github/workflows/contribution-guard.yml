name: Contribution Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contribution-guard:
    name: contribution-guard
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install secret scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
      - name: Check code, contracts, complete dataset, dependencies and secrets
        run: bash scripts/contribution-check.sh
      - name: Validate pull request dataset provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python -m scripts.guard
