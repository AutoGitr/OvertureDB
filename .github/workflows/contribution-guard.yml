name: Contribution Guard

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contribution-guard:
    name: contribution-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
      - name: Check code, contracts and complete dataset
        run: bash scripts/pre-commit-check.sh
      - name: Audit locked dependencies, including development and transitive packages
        run: uv audit --locked
      - name: Validate contribution provenance and changed URLs
        run: uv run --locked python scripts/guard.py
