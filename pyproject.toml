[project]
name = "overturedb"
version = "0.1.0"
description = "Curated dataset of clean artwork, verified themes, and franchise sets"
readme = ".github/README.md"
requires-python = "==3.14.7"
dependencies = [
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pyyaml==6.0.3",
    "ruff==0.16.8",
]

[tool.pyright]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.14"
include = ["scripts", "schema"]
extraPaths = ["schema", "scripts"]
