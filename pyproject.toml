[project]
name = "overturedb"
version = "0.1.0"
description = "Curated dataset of clean artwork, verified themes, and franchise sets"
readme = ".github/README.md"
requires-python = "==3.14.8"
dependencies = [
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pyyaml==6.0.3",
    "ruff==0.16.10",
]

[tool.pyright]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.14"
include = ["scripts", "schema", "tests"]
extraPaths = ["schema", "scripts"]

[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "C90",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PTH",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TCH",
    "UP",
    "W",
]

# These entry points intentionally report results and errors to the terminal.
[tool.ruff.lint.per-file-ignores]
"scripts/automation.py" = ["T201"]
"scripts/github.py" = ["T201"]
"scripts/catalog.py" = ["T201"]
"scripts/contribution.py" = ["T201"]
"scripts/import_bulk_export.py" = ["T201"]
"scripts/import_themerrdb.py" = ["T201"]
"scripts/sync_labels.py" = ["T201"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
