[project]
name = "overturedb"
version = "1.0.0"
description = "Artwork, collection & theme catalog for Overture"
readme = ".github/README.md"
requires-python = "==3.15.2"
dependencies = [
    "jsonschema==4.26.0",
    "pillow==13.0.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.4",
    "ruff==0.17.6",
    "zizmor==1.16.3",
]

[tool.uv]
required-version = "0.13.9"

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
addopts = ["-q", "-ra", "--tb=short"]
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["schema", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 90

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.15"
include = ["scripts", "schema", "tests"]
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"

[tool.ruff]
target-version = "py315"
line-length = 88
indent-width = 4

[tool.ruff.lint]
# The rule families Overture enforces, so both repositories hold one standard.
select = [
    "A",      # flake8-builtins: prevent shadowing Python built-ins
    "ARG",    # flake8-unused-arguments: parameters a function never reads
    "ASYNC",  # flake8-async: async/await hazard detection
    "B",      # flake8-bugbear: common bugs, anti-patterns, and design flaws
    "BLE",    # flake8-blind-except: every `except Exception` names why it is a boundary
    "C4",     # flake8-comprehensions: optimal comprehension syntax
    "C90",    # mccabe: cyclomatic complexity check
    "DTZ",    # flake8-datetimez: enforce timezone-aware datetimes
    "E",      # pycodestyle errors
    "ERA",    # eradicate: no commented-out code
    "EXE",    # flake8-executable: executable bits and shebangs
    "F",      # Pyflakes
    "FLY",    # flynt: f-strings over string joins
    "FIX",    # flake8-fixme: no TODO, FIXME, XXX or HACK left in the code
    "FURB",   # refurb: modern Python idioms
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "INP",    # flake8-no-pep420: packages need __init__.py
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PERF",   # Perflint
    "PGH",    # pygrep-hooks: explicit rule codes on ignore comments
    "PIE",    # flake8-pie
    "PL",     # Pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # Ruff-specific
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "T10",    # flake8-debugger
    "T20",    # flake8-print
    "TC",     # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # flake8-2020
]
ignore = [
    "PLR0911", # too-many-return-statements: validation guards return early
    "PLR0913", # too-many-arguments: covered by McCabe complexity
    "PLR0915", # too-many-statements: covered by McCabe complexity
    "PLR0917", # too-many-positional-arguments: duplicate of PLR0913
    "PLR2004", # magic-value-comparison: HTTP statuses and limits read better inline
]

# These entry points intentionally report results and errors to the terminal.
[tool.ruff.lint.per-file-ignores]
"scripts/automation.py" = ["T201"]
"scripts/github.py" = ["T201"]
"scripts/catalog.py" = ["T201"]
"scripts/catalog_health.py" = ["T201"]
"scripts/import_themerrdb.py" = ["T201"]
"scripts/sync_labels.py" = ["T201"]
# Tests validate with assertions; fakes take the arguments of what they replace.
"tests/**" = ["S101", "ARG"]

[tool.ruff.lint.flake8-tidy-imports]
# Every module-level import is deferred to first use (PEP 810), which also makes
# TYPE_CHECKING blocks unnecessary: an import used only in annotations never loads.
require-lazy = "all"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
