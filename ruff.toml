target-version = "py314"
line-length = 88
indent-width = 4

[lint]
select = [
    "A",
    "B",
    "C4",
    "C90",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PTH",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TCH",
    "UP",
    "W",
]

# These entry points intentionally report results and errors to the terminal.
[lint.per-file-ignores]
"scripts/automation.py" = ["T201"]
"scripts/catalog.py" = ["T201"]
"scripts/contribution.py" = ["T201"]
"scripts/import_bulk_export.py" = ["T201"]
"scripts/import_themerrdb.py" = ["T201"]
"scripts/sync_labels.py" = ["T201"]

[lint.mccabe]
max-complexity = 12

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
